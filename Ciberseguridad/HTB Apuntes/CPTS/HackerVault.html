<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackerVault — Pentest Knowledge Base</title>
<style>
  @property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
  :root{
    --canvas:#050506;--card:#0d0e0f;--card2:#141516;--elev:#191a1c;
    --bd:#1f2125;--bd2:#2a2d31;--bd3:#3a3e44;
    --acc:#e4f222;--accB:#1e2306;--accBd:#4d5212;
    --pa:#ffffff;--mi:#d0d6e0;--fo:#8a8f98;--as:#62666d;
    --mono:ui-monospace,"Cascadia Code","Consolas",SFMono-Regular,Menlo,monospace;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:6px;--rc:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--mi);font-family:var(--sans);line-height:1.45;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--acc);color:#000}
  .hide{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---------- HEADER ---------- */
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--canvas);border-bottom:.5px solid var(--bd)}
  .brand{font:600 15px/1 var(--mono);letter-spacing:.04em;color:#fff;white-space:nowrap}
  .brand span{color:var(--acc)}
  .count{font:500 11px var(--mono);color:var(--as);white-space:nowrap}
  .search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:9px;background:var(--card2);border:.5px solid var(--bd);border-radius:8px;padding:0 11px;height:36px}
  .search:focus-within{border-color:var(--accBd)}
  .search .ic{color:var(--as);font-size:14px}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--mi);font-size:13px}
  .search input::placeholder{color:var(--as)}
  .search kbd{font:11px var(--mono);color:var(--fo);background:var(--canvas);border:.5px solid var(--bd);border-radius:4px;padding:2px 6px}
  .tools{display:flex;align-items:center;gap:7px;position:relative}
  .ibtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--card2);border:.5px solid var(--bd);border-radius:7px;color:var(--mi);font-size:15px}
  .ibtn:hover{border-color:var(--accBd);color:var(--acc)}
  .menu{position:absolute;top:40px;right:0;background:var(--elev);border:.5px solid var(--bd2);border-radius:9px;padding:5px;min-width:190px;z-index:50;box-shadow:0 10px 30px #000a}
  .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:8px 10px;color:var(--mi);font-size:13px}
  .menu button:hover{background:var(--card2);color:#fff}
  .menu .sep{height:.5px;background:var(--bd);margin:5px 2px}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:0;padding:11px 18px 0;overflow-x:auto;scrollbar-width:thin}
  .seg{display:inline-flex;border:.5px solid var(--bd);border-radius:9px;overflow:hidden}
  .tab{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mi);background:var(--card);padding:8px 13px;border-right:.5px solid var(--bd);white-space:nowrap}
  .tab:last-child{border-right:0}
  .tab .num{font:600 9px var(--mono);color:var(--bd3)}
  .tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .tab:hover{background:var(--card2)}
  .tab.on{background:var(--acc);color:#000;font-weight:600}
  .tab.on .num{color:#00000073}
  .tab.on .dot{box-shadow:0 0 0 2px #0003}

  /* ---------- FILTERS ---------- */
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:.5px solid var(--bd)}
  .fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .flab{font:600 9px var(--mono);letter-spacing:.14em;color:var(--as);margin-right:2px}
  .chip{font-size:11px;color:var(--fo);background:var(--card);border:.5px solid var(--bd);border-radius:999px;padding:4px 11px;white-space:nowrap}
  .chip:hover{border-color:var(--bd3);color:var(--mi)}
  .chip.on{color:var(--acc);border-color:var(--accBd);background:var(--accB)}
  .spacer{flex:1}
  .scope{display:inline-flex;border:.5px solid var(--bd);border-radius:999px;overflow:hidden}
  .scope button{font:11px var(--mono);color:var(--fo);background:transparent;border:0;padding:5px 13px}
  .scope button.on{background:var(--acc);color:#000;font-weight:600}
  .clearf{font-size:11px;color:var(--as);background:transparent;border:0;text-decoration:underline;padding:4px}
  .clearf:hover{color:var(--mi)}

  /* ---------- SHELL ---------- */
  .shell{display:grid;grid-template-columns:244px 1fr;align-items:start}
  .shell.collapsed{grid-template-columns:30px 1fr}

  .vars{position:sticky;top:120px;align-self:start;border-right:.5px solid var(--bd);padding:15px 14px;max-height:calc(100vh - 120px);overflow:auto}
  .shell.collapsed .vars{display:none}
  .vhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .vhead .t{font:600 9px var(--mono);letter-spacing:.14em;color:var(--as)}
  .vhead .cl{margin-left:auto;display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:transparent;border:.5px solid var(--bd);border-radius:6px;color:var(--fo);font-size:13px}
  .vhead .cl:hover{color:var(--acc);border-color:var(--accBd)}
  .vrow{margin-bottom:11px}
  .vrow label{display:block;font:500 10px var(--mono);color:var(--acc);margin-bottom:4px}
  .vrow .desc{font-size:10px;color:var(--as);margin-bottom:4px}
  .vrow input{width:100%;background:var(--canvas);border:.5px solid var(--bd);border-radius:5px;color:var(--mi);font:12px var(--mono);padding:6px 8px;outline:0}
  .vrow input:focus{border-color:var(--accBd)}
  .vreset{width:100%;margin-top:6px;font:11px var(--mono);color:var(--fo);background:transparent;border:.5px solid var(--bd);border-radius:6px;padding:7px}
  .vreset:hover{color:var(--acc);border-color:var(--accBd)}

  .vhandle{display:none;align-items:center;justify-content:center;border-right:.5px solid var(--bd);min-height:calc(100vh - 120px);position:sticky;top:120px;background:var(--card)}
  .shell.collapsed .vhandle{display:flex}
  .vhandle button{writing-mode:vertical-rl;transform:rotate(180deg);background:transparent;border:0;color:var(--acc);font:10px var(--mono);letter-spacing:.14em;padding:12px 0}

  /* ---------- CONTENT / GRID ---------- */
  .content{padding:16px 18px 60px;min-width:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
  .empty{text-align:center;color:var(--as);font-family:var(--mono);font-size:13px;padding:60px 0}

  .card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--rc);padding:13px;display:flex;flex-direction:column;min-width:0}
  .card:hover{border-color:var(--bd2)}
  .chead{display:flex;align-items:center;gap:8px}
  .chead .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .chead h3{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chead .exp{margin-left:auto;background:transparent;border:.5px solid var(--bd);border-radius:5px;color:var(--fo);width:24px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .chead .exp:hover{color:var(--acc);border-color:var(--accBd)}
  .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font:600 8.5px var(--mono);letter-spacing:.05em;border-radius:4px;padding:3px 6px;color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent);border:.5px solid color-mix(in srgb,var(--c) 34%,transparent)}
  .badge{font:600 9px var(--mono);color:var(--fo);border:.5px solid var(--bd2);border-radius:4px;padding:2px 6px}
  .badge.sc{color:var(--mi)}
  .short{font-size:12px;color:var(--fo);margin-top:9px;line-height:1.5}

  .cmd{position:relative;margin-top:11px;background:#000;border:.5px solid var(--bd);border-radius:7px;padding:9px 34px 9px 10px}
  .cmd code{font:12px/1.55 var(--mono);color:var(--mi);word-break:break-all;white-space:pre-wrap;display:block}
  .cmd .p{color:var(--acc)}
  .cmd .v{color:var(--acc)}
  .cmd .fl{color:#fff;font-weight:600}
  .copy{position:absolute;top:7px;right:7px;width:24px;height:22px;display:flex;align-items:center;justify-content:center;background:#000;border:.5px solid var(--bd2);border-radius:5px;color:var(--as);font-size:12px;z-index:3}
  .copy:hover{color:var(--acc);border-color:var(--acc)}
  .rim{position:absolute;inset:0;border-radius:7px;padding:1.5px;pointer-events:none;opacity:0;z-index:2;
       -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
       mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
       background:conic-gradient(from var(--ga), var(--acc) 0deg, transparent 32deg, transparent 328deg, var(--acc) 360deg);
       filter:drop-shadow(0 0 3px var(--acc))}
  .cmd.go .rim{animation:glow 1s ease-out forwards}
  @keyframes glow{0%{--ga:-50deg;opacity:1}18%{opacity:1}75%{--ga:300deg;opacity:1}100%{--ga:300deg;opacity:0}}

  .foot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
  .subsbtn{font:11px var(--mono);color:var(--mi);background:transparent;border:.5px solid var(--bd);border-radius:6px;padding:5px 9px}
  .subsbtn:hover{border-color:var(--accBd);color:var(--acc)}
  .help{font:10.5px var(--mono);color:var(--as);display:flex;align-items:center;gap:5px;min-width:0}
  .help .hi{color:var(--fo)}
  .help b{color:var(--mi);font-weight:500}

  .subs{margin-top:11px;border-left:2px solid color-mix(in srgb,var(--c) 55%,transparent);padding-left:11px;display:flex;flex-direction:column;gap:11px}
  .sub .st{font-size:12px;color:#fff;font-weight:500}
  .sub .ss{font-size:11px;color:var(--as)}

  /* ---------- OVERLAY (big card) ---------- */
  .backdrop{position:fixed;inset:0;background:#000b;backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
  .sheet{width:min(820px,100%);background:var(--card);border:.5px solid var(--bd2);border-top:3px solid var(--c);border-radius:var(--rc);padding:22px 24px;box-shadow:0 20px 60px #000c}
  .sheet .xh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sheet .xh .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .sheet .xh h2{font-size:20px;font-weight:600;color:#fff}
  .sheet .xh .x{margin-left:auto;background:transparent;border:.5px solid var(--bd2);border-radius:6px;color:var(--fo);width:30px;height:28px;font-size:15px}
  .sheet .xh .x:hover{color:var(--acc);border-color:var(--accBd)}
  .sheet .xshort{color:var(--mi);font-size:13px;margin:8px 0 14px;line-height:1.6}
  .sheet .xmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .ssect{font:600 10px var(--mono);letter-spacing:.14em;color:var(--as);margin:18px 0 9px}
  .subcard{background:var(--card2);border:.5px solid var(--bd);border-radius:9px;padding:13px;margin-bottom:10px}
  .subcard .sct{font-size:14px;color:#fff;font-weight:500}
  .subcard .scs{font-size:11px;color:var(--as);margin-top:2px}
  .subcard .info{font-size:12px;color:var(--mi);line-height:1.6;margin-top:9px}
  .subcard .info b{color:#fff;font-weight:600}
  .ex{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .source{font:10px var(--mono);color:var(--as);margin-top:14px;border-top:.5px solid var(--bd);padding-top:10px}

  /* ---------- PALETTE ⌘K ---------- */
  .palwrap{position:fixed;inset:0;background:#000a;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:90px 20px}
  .pal{width:min(640px,100%);background:var(--elev);border:.5px solid var(--bd2);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px #000d}
  .palin{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:.5px solid var(--bd)}
  .palin .pr{color:var(--acc);font:15px var(--mono)}
  .palin input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:14px var(--mono)}
  .palres{max-height:52vh;overflow:auto;padding:6px}
  .palsec{font:600 9px var(--mono);letter-spacing:.14em;color:var(--as);padding:9px 10px 5px}
  .palrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer}
  .palrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .palrow .nm{font-size:13px;color:var(--mi)}
  .palrow .cx{margin-left:auto;font:10px var(--mono);color:var(--as);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
  .palrow.sel,.palrow:hover{background:var(--card2)}
  .palrow.sel .nm{color:#fff}
  .palfoot{display:flex;gap:14px;padding:9px 14px;border-top:.5px solid var(--bd);font:10px var(--mono);color:var(--as)}

  /* ---------- MODAL (CRUD) ---------- */
  .mbody{width:min(680px,100%);background:var(--card);border:.5px solid var(--bd2);border-radius:var(--rc);padding:20px 22px;box-shadow:0 20px 60px #000c}
  .mbody h2{font-size:17px;color:#fff;font-weight:600;margin-bottom:14px}
  .frow{margin-bottom:11px}
  .frow label{display:block;font:600 10px var(--mono);letter-spacing:.08em;color:var(--as);margin-bottom:4px}
  .frow input,.frow select,.frow textarea{width:100%;background:var(--canvas);border:.5px solid var(--bd);border-radius:6px;color:var(--mi);font:13px var(--sans);padding:8px 10px;outline:0}
  .frow textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:70px}
  .frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accBd)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
  .btn{font:13px var(--sans);border-radius:7px;padding:9px 16px;border:.5px solid var(--bd2);background:transparent;color:var(--mi)}
  .btn:hover{border-color:var(--bd3)}
  .btn.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
  .btn.danger{color:#ff6b6b;border-color:#4a2222}
  .btn.danger:hover{background:#2a1515}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--elev);border:.5px solid var(--accBd);border-radius:9px;padding:10px 16px;color:var(--mi);font:12px var(--mono);opacity:0;pointer-events:none;transition:.22s;z-index:90}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--acc)}

  @media(max-width:720px){
    .search{order:3;max-width:none;flex-basis:100%}
    .top{flex-wrap:wrap}
    .shell{grid-template-columns:1fr}
    .vars{position:static;max-height:none;border-right:0;border-bottom:.5px solid var(--bd)}
    .vhandle{display:none !important}
    .shell.collapsed .vars{display:block}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">HACKER<span>VAULT</span></div>
  <div class="count" id="count"></div>
  <div class="search">
    <span class="ic">⌕</span>
    <input id="q" type="text" placeholder="Buscar herramienta, flag, comando, MITRE…" autocomplete="off">
    <kbd>Ctrl K</kbd>
  </div>
  <div class="tools">
    <button class="ibtn" id="btnAdd" title="Nueva herramienta" aria-label="Nueva herramienta">+</button>
    <button class="ibtn" id="btnMenu" title="Más opciones" aria-label="Más opciones">⋯</button>
    <div class="menu hide" id="menu">
      <button id="mExport">⤓  Exportar JSON</button>
      <button id="mImport">⤒  Importar JSON</button>
      <div class="sep"></div>
      <button id="mRestore">↺  Restaurar base original</button>
    </div>
  </div>
</header>

<nav class="tabs"><div class="seg" id="tabs"></div></nav>

<div class="filters" id="filters">

  <span class="spacer"></span>
  <div class="scope" id="scope">
    <button data-s="" class="on">Todo</button>
    <button data-s="red">Red</button>
    <button data-s="host">Host</button>
  </div>
  <button class="clearf" id="clearf">limpiar filtros</button>
</div>

<main class="shell" id="shell">
  <aside class="vars" id="vars"></aside>
  <div class="vhandle"><button id="reopen">VARIABLES ›</button></div>
  <section class="content">
    <div class="grid" id="grid"></div>
    <div class="empty hide" id="empty">Sin resultados. Ajusta la búsqueda o los filtros.</div>
  </section>
</main>

<input type="file" id="importFile" accept="application/json,.json" class="hide">
<div class="toast" id="toast"></div>

const LS_DATA="hackervault_data_v1", LS_VARS="hackervault_vars_v1", LS_BVER="hackervault_basever";
const BASE_VERSION=3;
const BASE_DATA=JSON.parse(JSON.stringify(DATA));

/* ---- persistencia ---- */
function loadData(){
  let stored=null;
  try{ const s=localStorage.getItem(LS_DATA); if(s) stored=JSON.parse(s); }catch(e){}
  if(!Array.isArray(stored)) return JSON.parse(JSON.stringify(BASE_DATA));
  let v=0; try{ v=parseInt(localStorage.getItem(LS_BVER)||"0",10)||0; }catch(e){}
  if(v<BASE_VERSION){
    const names=new Set(stored.map(t=>t&&t.name));
    BASE_DATA.forEach(t=>{ if(!names.has(t.name)) stored.push(JSON.parse(JSON.stringify(t))); });
    try{ localStorage.setItem(LS_BVER,String(BASE_VERSION)); }catch(e){}
    try{ localStorage.setItem(LS_DATA,JSON.stringify(stored)); }catch(e){}
  }
  return stored;
}
function saveData(){ try{ localStorage.setItem(LS_DATA,JSON.stringify(data)); localStorage.setItem(LS_BVER,String(BASE_VERSION)); }catch(e){} }
function defVars(){ const o={}; VAR_DEFS.forEach(v=>o[v.k]=v.d); return o; }
function loadVars(){
  let o=defVars();
  try{ const s=localStorage.getItem(LS_VARS); if(s){ const p=JSON.parse(s); if(p&&typeof p==='object') Object.keys(o).forEach(k=>{ if(p[k]!=null) o[k]=p[k]; }); } }catch(e){}
  return o;
}
function saveVars(){ try{ localStorage.setItem(LS_VARS,JSON.stringify(vars)); }catch(e){} }

let data=loadData();
let vars=loadVars();
hydrateHelp();

const filters={phase:new Set(),os:new Set(),approach:new Set(),scope:"",q:""};
const openSubs=new Set();

/* ---- helpers ---- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function substitute(cmd){ return String(cmd).replace(/\{\{(\w+)\}\}/g,(m,k)=> (vars[k]!=null&&vars[k]!=="")?vars[k]:m); }
function hlCmd(cmd){
  let s=esc(cmd);
  s=s.replace(/\{\{(\w+)\}\}/g,(m,k)=>{ const has=vars[k]!=null&&vars[k]!==""; return '<span class="v">'+esc(has?vars[k]:("{{"+k+"}}"))+'</span>'; });
  s=s.replace(/(^|[\s(|;&])(-{1,2}[A-Za-z0-9][\w-]*)/g,(m,p,f)=>p+'<span class="fl">'+f+'</span>');
  return s;
}
function cmdBlock(cmd,prompt){
  const raw=encodeURIComponent(cmd);
  return '<div class="cmd"><span class="rim"></span><button class="copy" data-raw="'+raw+'" title="Copiar" aria-label="Copiar comando">⧉</button>'+
         '<code>'+(prompt!==false?'<span class="p">$</span> ':'')+hlCmd(cmd)+'</code></div>';
}
function osShort(o){ return o==="Multiplataforma"?"Multi":o; }
function phaseColor(p){ return PHASE_COLOR[p]||"#6b7a8f"; }

/* ---- búsqueda ---- */
function haystack(t){
  let s=[t.name,t.short,t.cmd,t.mitre,t.help,(t.os||[]).join(" "),(t.approach||[]).join(" ")];
  (t.subs||[]).forEach(sub=>{ s.push(sub.title,sub.short,sub.cmd,sub.info); (sub.examples||[]).forEach(e=>s.push(e)); });
  return s.join(" \u0001 ").toLowerCase();
}
function matches(t){
  if(filters.phase.size && !filters.phase.has(t.phase)) return false;
  if(filters.os.size && !(t.os||[]).some(o=>filters.os.has(o))) return false;
  if(filters.approach.size && !(t.approach||[]).some(a=>filters.approach.has(a))) return false;
  if(filters.scope && !(t.ambito===filters.scope || t.ambito==="ambas")) return false;
  if(filters.q){ const q=filters.q.toLowerCase().trim(); if(q && !haystack(t).includes(q)) return false; }
  return true;
}

/* ---- render: grid ---- */
function toolCard(t,idx){
  const col=phaseColor(t.phase);
  const subs=t.subs||[];
  const osB=(t.os||[]).map(o=>'<span class="badge">'+esc(osShort(o))+'</span>').join("");
  const scB='<span class="badge sc">'+esc(AMBITO_LABEL[t.ambito]||"Red+Host")+'</span>';
  const help=t.help?'<span class="help"><span class="hi">⌨</span><b>'+esc(t.help)+'</b></span>':"";
  let inline="";
  if(openSubs.has(idx)){
    inline='<div class="subs">'+subs.map(s=>'<div class="sub"><div class="st">'+esc(s.title)+'</div>'+
      (s.short?'<div class="ss">'+esc(s.short)+'</div>':"")+cmdBlock(s.cmd)+'</div>').join("")+'</div>';
  }
  return '<article class="card" style="--c:'+col+'" data-idx="'+idx+'">'+
    '<div class="chead"><span class="dot"></span><h3 title="'+esc(t.name)+'">'+esc(t.name)+'</h3>'+
      '<button class="exp" data-exp="'+idx+'" title="Expandir">⤢</button></div>'+
    '<div class="meta">'+(t.mitre?'<span class="tag">'+esc(t.mitre)+'</span>':"")+osB+scB+'</div>'+
    (t.short?'<p class="short">'+esc(t.short)+'</p>':"")+
    (t.cmd?cmdBlock(t.cmd):"")+
    '<div class="foot">'+(subs.length?'<button class="subsbtn" data-subs="'+idx+'">↳ '+subs.length+' subcomando'+(subs.length>1?'s':'')+(openSubs.has(idx)?' ▴':' ▾')+'</button>':"")+help+'</div>'+
    inline+'</article>';
}
function renderGrid(){
  const rows=[]; data.forEach((t,idx)=>{ if(matches(t)) rows.push(toolCard(t,idx)); });
  $("#grid").innerHTML=rows.join("");
  $("#empty").classList.toggle("hide",rows.length>0);
  $("#count").textContent=rows.length+" de "+data.length+" herramientas";
}
function rerender(){ renderTabs(); renderFilters(); renderGrid(); }

/* ---- ⌘K palette ---- */
let palEl=null, palSel=0, palItems=[];
function closePal(){ if(palEl){ palEl.remove(); palEl=null; } }
function openPal(){
  closePal();
  palEl=document.createElement("div"); palEl.className="palwrap";
  palEl.innerHTML='<div class="pal"><div class="palin"><span class="pr">&gt;</span>'+
    '<input id="palq" placeholder="buscar herramienta, subcomando, flag, MITRE…" autocomplete="off"></div>'+
    '<div class="palres" id="palres"></div>'+
    '<div class="palfoot"><span>↑↓ navegar</span><span>↵ abrir</span><span>esc cerrar</span></div></div>';
  palEl.addEventListener("mousedown",e=>{ if(e.target===palEl) closePal(); });
  document.body.appendChild(palEl);
  const inp=palEl.querySelector("#palq");
  inp.value=filters.q||""; inp.focus();
  palFilter(inp.value);
  inp.addEventListener("input",()=>palFilter(inp.value));
  inp.addEventListener("keydown",palKey);
}
function palFilter(q){
  q=(q||"").toLowerCase().trim();
  palItems=[]; const tools=[], sub=[];
  data.forEach((t,idx)=>{
    if(!q || haystack(t).includes(q)){
      if(!q || (t.name+" "+(t.short||"")+" "+(t.mitre||"")).toLowerCase().includes(q)) tools.push({idx});
    }
    (t.subs||[]).forEach((s,si)=>{ if(q && ((s.title||"")+" "+(s.cmd||"")+" "+(s.info||"")).toLowerCase().includes(q)) sub.push({idx,si}); });
  });
  let html="";
  if(tools.length){ html+='<div class="palsec">HERRAMIENTAS</div>'; tools.slice(0,40).forEach(o=>{ const t=data[o.idx]; palItems.push({idx:o.idx}); html+=palRow(palItems.length-1,phaseColor(t.phase),t.name,substitute(t.cmd||"")); }); }
  if(sub.length){ html+='<div class="palsec">SUBCOMANDOS</div>'; sub.slice(0,40).forEach(o=>{ const t=data[o.idx], s=t.subs[o.si]; palItems.push({idx:o.idx}); html+=palRow(palItems.length-1,phaseColor(t.phase),t.name+" · "+s.title,substitute(s.cmd||"")); }); }
  if(!html) html='<div class="palsec">sin resultados</div>';
  palSel=0;
  const res=palEl.querySelector("#palres"); res.innerHTML=html; markSel();
  res.querySelectorAll(".palrow").forEach(r=>r.addEventListener("click",()=>{ const i=+r.dataset.i; closePal(); openSheet(palItems[i].idx); }));
}
function palRow(i,col,nm,cx){ return '<div class="palrow" data-i="'+i+'" style="--c:'+col+'"><span class="dot"></span><span class="nm">'+esc(nm)+'</span><span class="cx">'+esc(cx)+'</span></div>'; }
function markSel(){ if(!palEl)return; palEl.querySelectorAll(".palrow").forEach((r,i)=>r.classList.toggle("sel",i===palSel)); const s=palEl.querySelector(".palrow.sel"); if(s)s.scrollIntoView({block:"nearest"}); }
function palKey(e){
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);markSel();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(palSel-1,0);markSel();}
  else if(e.key==="Enter"){e.preventDefault(); if(palItems[palSel]){ const idx=palItems[palSel].idx; closePal(); openSheet(idx);} }
}

/* ---- CRUD ---- */
function openForm(idx){
  const t=idx!=null?data[idx]:{name:"",phase:"recon",os:["Linux"],mitre:"",approach:[],ambito:"ambas",source:"",short:"",cmd:"",help:"",subs:[]};
  const phOpts=PHASE_ORDER.map(p=>'<option value="'+p+'"'+(t.phase===p?' selected':'')+'>'+esc(TAB_LABEL[p])+'</option>').join("");
  const scOpts=["red","host","ambas"].map(s=>'<option value="'+s+'"'+(t.ambito===s?' selected':'')+'>'+esc(AMBITO_LABEL[s])+'</option>').join("");
  const html='<h2>'+(idx!=null?"Editar herramienta":"Nueva herramienta")+'</h2>'+
    '<div class="frow"><label>NOMBRE</label><input id="f_name" value="'+esc(t.name)+'"></div>'+
    '<div class="fgrid"><div class="frow"><label>FASE</label><select id="f_phase">'+phOpts+'</select></div>'+
      '<div class="frow"><label>ÁMBITO</label><select id="f_ambito">'+scOpts+'</select></div></div>'+
    '<div class="fgrid"><div class="frow"><label>SO (coma)</label><input id="f_os" value="'+esc((t.os||[]).join(", "))+'"></div>'+
      '<div class="frow"><label>MITRE</label><input id="f_mitre" value="'+esc(t.mitre||"")+'"></div></div>'+
    '<div class="fgrid"><div class="frow"><label>ENFOQUE (coma)</label><input id="f_ap" value="'+esc((t.approach||[]).join(", "))+'"></div>'+
      '<div class="frow"><label>FUENTE</label><input id="f_source" value="'+esc(t.source||"")+'"></div></div>'+
    '<div class="frow"><label>DESCRIPCIÓN CORTA</label><textarea id="f_short">'+esc(t.short||"")+'</textarea></div>'+
    '<div class="frow"><label>COMANDO PRINCIPAL</label><textarea id="f_cmd">'+esc(t.cmd||"")+'</textarea></div>'+
    '<div class="frow"><label>AYUDA / USO</label><input id="f_help" value="'+esc(t.help||"")+'"></div>'+
    '<div class="frow"><label>SUBCOMANDOS (JSON: [{title,short,cmd,info,examples,source}])</label><textarea id="f_subs" style="min-height:120px">'+esc(JSON.stringify(t.subs||[],null,2))+'</textarea></div>'+
    '<div class="mfoot"><button class="btn" data-close>cancelar</button><button class="btn primary" id="f_save">guardar</button></div>';
  const bd=openModal(html,"mbody");
  bd.querySelector("#f_save").addEventListener("click",()=>{
    const name=bd.querySelector("#f_name").value.trim(); if(!name){ toast("El nombre es obligatorio"); return; }
    let subs=[]; try{ subs=JSON.parse(bd.querySelector("#f_subs").value||"[]"); if(!Array.isArray(subs)) throw 0; }catch(e){ toast("JSON de subcomandos inválido"); return; }
    const obj={name,phase:bd.querySelector("#f_phase").value,
      os:bd.querySelector("#f_os").value.split(",").map(s=>s.trim()).filter(Boolean),
      mitre:bd.querySelector("#f_mitre").value.trim(),
      approach:bd.querySelector("#f_ap").value.split(",").map(s=>s.trim()).filter(Boolean),
      ambito:bd.querySelector("#f_ambito").value, source:bd.querySelector("#f_source").value.trim(),
      short:bd.querySelector("#f_short").value.trim(), cmd:bd.querySelector("#f_cmd").value.trim(),
      help:bd.querySelector("#f_help").value.trim(), subs};
    if(idx!=null) data[idx]=obj; else data.push(obj);
    saveData(); closeOverlay(); rerender(); toast(idx!=null?"Herramienta actualizada":"Herramienta añadida");
  });
}
function delTool(idx){
  const t=data[idx]; if(!t) return;
  if(!confirm('¿Borrar "'+t.name+'"? Esta acción no se puede deshacer.')) return;
  data.splice(idx,1); saveData(); closeOverlay(); rerender(); toast("Herramienta borrada");
}

/* ---- import / export / restore ---- */
function doExport(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="hackervault-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("JSON exportado");
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!Array.isArray(p)) throw 0; data=p; hydrateHelp(); hydrateAmbito(); saveData(); rerender(); toast("JSON importado ("+data.length+" tools)"); }catch(e){ toast("Archivo JSON inválido"); } };
  r.readAsText(file);
}
function doRestore(){
  if(!confirm("Restaurar la base original. Se perderán tus cambios locales. ¿Continuar?")) return;
  data=JSON.parse(JSON.stringify(BASE_DATA)); hydrateHelp(); hydrateAmbito(); saveData(); rerender(); toast("Base restaurada");
}

/* ---- toast ---- */
let toastT=null;
function toast(msg){ const el=$("#toast"); el.innerHTML=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1800); }

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener("click",e=>{
  const T=e.target;
  // copiar + glow
  const cp=T.closest&&T.closest(".copy");
  if(cp){ const raw=decodeURIComponent(cp.dataset.raw||""); const txt=substitute(raw);
    try{ navigator.clipboard&&navigator.clipboard.writeText(txt); }catch(_){ }
    const cmd=cp.closest(".cmd"); if(cmd){ cmd.classList.remove("go"); void cmd.offsetWidth; cmd.classList.add("go"); }
    toast('<b>⧉</b> comando copiado'); return; }
  // tabs
  const tab=T.closest&&T.closest(".tab");
  if(tab){ const p=tab.dataset.phase; if(filters.phase.has(p))filters.phase.delete(p); else filters.phase.add(p); rerender(); return; }
  // chips os
  const os=T.closest&&T.closest("[data-os]"); if(os){ const v=os.dataset.os; if(filters.os.has(v))filters.os.delete(v); else filters.os.add(v); rerender(); return; }
  const ap=T.closest&&T.closest("[data-ap]"); if(ap){ const v=ap.dataset.ap; if(filters.approach.has(v))filters.approach.delete(v); else filters.approach.add(v); rerender(); return; }
  // scope
  const sc=T.closest&&T.closest("#scope button"); if(sc){ filters.scope=sc.dataset.s; $("#scope").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===sc)); renderGrid(); return; }
  if(T.id==="clearf"){ filters.phase.clear();filters.os.clear();filters.approach.clear();filters.scope="";filters.q="";$("#q").value="";$("#scope").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===0)); rerender(); return; }
  // subs inline
  const sb=T.closest&&T.closest("[data-subs]"); if(sb){ const i=+sb.dataset.subs; if(openSubs.has(i))openSubs.delete(i); else openSubs.add(i); renderGrid(); return; }
  // expand sheet
  const ex=T.closest&&T.closest("[data-exp]"); if(ex){ openSheet(+ex.dataset.exp); return; }
  // sheet actions
  if(T.closest&&T.closest("[data-close]")){ closeOverlay(); return; }
  const ed=T.closest&&T.closest("[data-edit]"); if(ed){ const i=+ed.dataset.edit; closeOverlay(); openForm(i); return; }
  const dl=T.closest&&T.closest("[data-del]"); if(dl){ delTool(+dl.dataset.del); return; }
  // vars collapse
  if(T.id==="collapseV"){ $("#shell").classList.add("collapsed"); return; }
  if(T.id==="reopen"){ $("#shell").classList.remove("collapsed"); return; }
  if(T.id==="resetV"){ vars=defVars(); saveVars(); renderVars(); renderGrid(); toast("Variables restauradas"); return; }
  // header
  if(T.id==="btnAdd"){ openForm(null); return; }
  if(T.id==="btnMenu"){ $("#menu").classList.toggle("hide"); return; }
  if(T.id==="mExport"){ doExport(); $("#menu").classList.add("hide"); return; }
  if(T.id==="mImport"){ $("#importFile").click(); $("#menu").classList.add("hide"); return; }
  if(T.id==="mRestore"){ doRestore(); $("#menu").classList.add("hide"); return; }
  // cerrar menú al hacer click fuera
  if(!T.closest("#menu")&&!T.closest("#btnMenu")) $("#menu").classList.add("hide");
});
// variables input
$("#vars").addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ vars[k]=e.target.value; saveVars(); renderGrid(); if(backdropEl&&backdropEl.querySelector(".sheet")){ /* refrescar ficha abierta */ const idx=null; } } });
// búsqueda
$("#q").addEventListener("input",e=>{ filters.q=e.target.value; renderGrid(); });
// import file
$("#importFile").addEventListener("change",e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; });
// teclado global
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); if(palEl)closePal(); else openPal(); return; }
  if(e.key==="Escape"){ if(palEl){closePal();return;} if(backdropEl){closeOverlay();return;} $("#menu").classList.add("hide"); }
  if(e.key==="/"&&!/input|textarea/i.test((document.activeElement||{}).tagName||"")){ e.preventDefault(); $("#q").focus(); }
});

/* ---- arranque ---- */
renderVars();
rerender();
</script>
</body>
</html>
